[project]
name = "simras-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "geopandas>=1,<2",
  "httpx>=0.27,<1",
  "pandas>=2,<3",
  "prefect>=3,<4",
  "pyogrio>=0.10,<1",
  "shapely>=2,<3",
  "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

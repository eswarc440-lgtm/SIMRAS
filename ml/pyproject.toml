[project]
name = "simras-ml"
version = "0.1.0"
description = "Governed asset-state and bridge deterioration training pipelines for SIMRAS"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.4,<2",
  "mlflow>=3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

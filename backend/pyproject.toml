[project]
name = "simras-backend"
version = "0.1.0"
description = "Source-aware infrastructure digital twin API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "matplotlib>=3.9,<4",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "alembic*", "reports*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
